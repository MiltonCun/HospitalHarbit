<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <!-- Seguridad - Content Security Policy -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; img-src 'self' data:;">
    <!-- Evitar ataques X-Frame-Options -->
    <meta http-equiv="X-Frame-Options" content="SAMEORIGIN">
    <!-- Evitar MIME type sniffing -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    
    <title>Acceso Hospital Harbit</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./CSS/login.css">
    <link rel="shortcut icon" href="./IMG/iconHospital.jpg" type="image/x-icon">
</head>
<body>
    <div class="main-wrapper">
        <img src="./IMG/logoHospital.png" class="hospital-logo" alt="Logo Hospital Harbit">
        <div class="login-container">
            <h1>ACCESO AL SISTEMA</h1>
            <h2 class="hospital-title">HOSPITAL HARBIT</h2>
            
            <!-- Mensaje de error -->
            <div id="error-message" class="alert alert-danger" role="alert" style="display: none;"></div>
            
            <!-- Formulario -->
            <form id="loginForm" novalidate>
                <div class="input-group">
                    <label for="username">INGRESE SU USUARIO</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username"
                        required 
                        minlength="3"
                        maxlength="50"
                        autocomplete="username"
                        aria-label="Usuario"
                        aria-required="true"
                    >
                    <small id="username-error" class="form-text text-danger" role="alert"></small>
                </div>
                
                <div class="input-group">
                    <label for="password">INGRESE SU CONTRASEÑA</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password"
                        required 
                        minlength="6"
                        maxlength="100"
                        autocomplete="current-password"
                        aria-label="Contraseña"
                        aria-required="true"
                    >
                    <small id="password-error" class="form-text text-danger" role="alert"></small>
                </div>
                
                <button type="submit" id="submitBtn" aria-label="Botón para acceder al sistema">ACCEDER</button>
                <p class="text-center mt-3"><a href="./inicio.html" class="text-decoration-none">Volver a inicio</a></p>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./JS/login.js"></script>
</body>
</html>
